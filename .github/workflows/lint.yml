jobs:
  run-static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    permissions:
      security-events: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run detekt and Android Lint
        run: ./gradlew detekt lintDebug --continue
        working-directory: ./android

      - name: Upload detekt SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ./android/detekt-report.sarif
          category: detekt

      - name: Upload Android Lint SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ./android/lint-report.sarif
          category: android-lint

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
    branches: [main]
